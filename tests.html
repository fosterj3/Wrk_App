<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence tests</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{padding:24px;max-width:820px;margin-inline:auto}
  h1{font-size:24px;margin-bottom:4px}
  #summary{font-size:17px;font-weight:700;margin:16px 0}
  .grp{margin-top:22px}
  .grp h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .t{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
  .t:last-child{border-bottom:0}
  .t .mark{flex:0 0 18px;font-weight:700}
  .pass .mark{color:var(--good)}
  .fail .mark{color:var(--danger)}
  .fail{color:var(--danger)}
  .why{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;
       font-family:ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>

<h1>Cadence tests</h1>
<p class="muted small">Pure-logic checks for the parser, the CSV round trip, the plan builder and
  the stats helpers. No tooling — just open this page.</p>
<div id="summary">Running…</div>
<div id="out"></div>

<!-- The real modules, in the same order app.html loads them. Nothing is stubbed,
     so a test failing here means the shipped code is wrong. -->
<script src="util.js"></script>
<script src="library.js"></script>
<script src="parse.js"></script>
<script src="plan.js"></script>
<script src="viz.js"></script>
<script src="tests.js"></script>

</body>
</html>
